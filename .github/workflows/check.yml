name: Tests and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name ByteShield --collect-data byteshield app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ByteShield-Windows
          path: dist/ByteShield.exe
